name: Refresh company news

# Fetches each company's own press-release feed and commits the result.
# Runs server-side because browsers cannot fetch cross-origin RSS, and because
# no API key belongs in a public static site.
on:
  schedule:
    # 05:40 UTC daily. Off the hour, so as not to pile onto the busiest minute.
    - cron: '40 5 * * *'
  workflow_dispatch:

# Needed to push the refreshed data/news.json back to the branch.
permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch company announcements
        run: node scripts/fetch-news.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Refresh company news"
          git push
